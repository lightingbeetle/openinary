name: Publish Lighting Beetle Openinary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-openinary
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lightingbeetle/openinary

jobs:
  build:
    if: github.repository == 'lightingbeetle/openinary' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build full image on native runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/full.Dockerfile
          platforms: linux/${{ matrix.arch }}
          pull: true
          load: true
          tags: openinary-verify:${{ github.sha }}
          build-args: |
            IMAGE_TAG=lb-node-22.23.4-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=openinary-full-${{ matrix.arch }}
          cache-to: type=gha,scope=openinary-full-${{ matrix.arch }},mode=min

      - name: Verify Node and native modules without network
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          docker run --rm --network none --entrypoint node \
            --workdir /app/apps/api "openinary-verify:${SOURCE_SHA}" -e '
              const assert = require("node:assert/strict");
              assert.equal(process.version, "v22.23.4");
              const Database = require("better-sqlite3");
              const db = new Database(":memory:");
              assert.equal(db.prepare("SELECT 42 AS value").get().value, 42);
              db.close();
              const sharp = require("/app/packages/core/node_modules/sharp");
              sharp({ create: { width: 16, height: 12, channels: 3, background: "#336699" } })
                .resize(8, 6).png().toBuffer({ resolveWithObject: true })
                .then(({ info }) => {
                  assert.equal(info.width, 8);
                  assert.equal(info.height, 6);
                  console.log("Node v22.23.4, SQLite and image transformation verified");
                })
                .catch(error => { console.error(error); process.exitCode = 1; });
            '

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified architecture image
        env:
          SOURCE_SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          tag="${IMAGE}:sha-${SOURCE_SHA}-${ARCH}"
          docker tag "openinary-verify:${SOURCE_SHA}" "$tag"
          docker push "$tag"
          mkdir -p /tmp/digests
          docker image inspect "$tag" --format '{{index .RepoDigests 0}}' > /tmp/digests/image.txt
          grep -Eq '^ghcr\.io/lightingbeetle/openinary@sha256:[a-f0-9]{64}$' /tmp/digests/image.txt

      - name: Save immutable architecture reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/image.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified image references
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: /tmp/digests

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform image and deployment reference
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          amd64=$(cat /tmp/digests/digest-amd64/image.txt)
          arm64=$(cat /tmp/digests/digest-arm64/image.txt)
          docker buildx imagetools create \
            --tag "${IMAGE}:sha-${SOURCE_SHA}" \
            --tag "${IMAGE}:node-22.23.4" \
            "$amd64" "$arm64"
          digest=$(docker buildx imagetools inspect "${IMAGE}:sha-${SOURCE_SHA}" --format '{{.Manifest.Digest}}')
          {
            echo '## Deployment image'
            echo "\`${IMAGE}@${digest}\`"
            echo ''
            echo 'Both linux/amd64 and linux/arm64 passed Node and native-module checks.'
            echo 'For a newly created GHCR package, set package visibility to Public before anonymous pulls.'
            echo 'Coolify is not changed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
